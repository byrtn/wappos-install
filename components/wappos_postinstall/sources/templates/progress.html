<!doctype html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ t('page_title') }}</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
  <link rel="preload" href="{{ url_for('static', filename='fonts/Montserrat-Variable.woff2') }}" as="font" type="font/woff2" crossorigin>
  <script>
    (function () {
      var saved = localStorage.getItem('wappos_admin_theme');
      var wantDark = saved === 'dark' || (saved !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', wantDark ? 'dark' : 'light');
    })();
  </script>
  <style>
    :root, html[data-theme="light"] {
      color-scheme: light;
      --color-bg: #fafafa;
      --color-text: #222;
      --color-text-muted: #666;
      --color-border: #eee;
      --color-border-strong: #ccc;
      --color-btn-bg: #016f93;
      --color-btn-bg-hover: #015a78;
      --color-btn-text: #fff;
      --color-link: #016f93;
      --color-error-bg: #fbe9e7;
      --color-error-text: #7a1f00;
      --color-success-bg: #e6f4ea;
      --color-success-text: #1e4620;
      --color-text-faint: #999;
    }
    html[data-theme="dark"] {
      color-scheme: dark;
      --color-bg: #14171a;
      --color-text: #cfcfcf;
      --color-text-muted: #b3b3b3;
      --color-border: #2c3036;
      --color-border-strong: #3a3f45;
      --color-btn-bg: #0195df;
      --color-btn-bg-hover: #0badfe;
      --color-btn-text: #fff;
      --color-link: #0195df;
      --color-error-bg: #3a1f18;
      --color-error-text: #f5b7a8;
      --color-success-bg: #1c3324;
      --color-success-text: #a8e6bc;
      --color-text-faint: #969696;
    }
    @font-face {
      font-family: 'Montserrat';
      font-style: normal;
      font-weight: 100 900;
      font-display: swap;
      src: url('{{ url_for('static', filename='fonts/Montserrat-Variable.woff2') }}') format('woff2');
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0; letter-spacing: -0.015em;
      background: var(--color-bg); color: var(--color-text);
      display: flex; flex-direction: column; align-items: center;
    }
    .page-center { width: 100%; display: flex; flex-direction: column; align-items: center; padding: 2rem 1.25rem; }
    .page-inner { width: 100%; max-width: 720px; }
    .wappos-brand-mark { color: var(--color-btn-bg); font-weight: 700; letter-spacing: 0.06em; }
    #brand-text { text-align: center; font-size: 1.6rem; margin-bottom: 0.75rem; }
    .page-subtitle { display: flex; align-items: center; justify-content: center; gap: 0.75rem;
      font-weight: 300; letter-spacing: 0.15em; font-size: 0.8rem;
      color: var(--color-text-faint); margin: 0 0 1.75rem; text-transform: uppercase; }
    .page-subtitle-rule { flex: 0 0 28px; height: 1px; background: var(--color-border-strong); }

    .intro { text-align: center; font-size: 0.92rem; color: var(--color-text-muted); margin-bottom: 1.5rem; }

    .banner { padding: 0.9rem 1.1rem; border-radius: 10px; font-size: 0.95rem; text-align: center; margin-top: 1.25rem; }
    .banner.success { background: var(--color-success-bg); color: var(--color-success-text); }
    .banner.error { background: var(--color-error-bg); color: var(--color-error-text); }
    .banner[hidden] { display: none; }
    .banner .btn-portal {
      display: inline-block; margin-top: 0.75rem; padding: 0.6rem 1.4rem; border-radius: 8px;
      background: var(--color-btn-bg); color: var(--color-btn-text); text-decoration: none; font-weight: 600;
    }
    .banner .btn-portal:hover { background: var(--color-btn-bg-hover); }

    .spinner-row { display: flex; align-items: center; justify-content: center; gap: 0.6rem; margin-bottom: 1.25rem; color: var(--color-text-muted); font-size: 0.88rem; }
    .spinner-row[hidden] { display: none; }
    .spinner {
      width: 18px; height: 18px; border-radius: 50%; flex: 0 0 auto;
      border: 2px solid var(--color-border-strong); border-top-color: var(--color-btn-bg);
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .step-label { text-align: center; font-size: 0.85rem; color: var(--color-text-muted); margin-bottom: 1rem; }
    .step-label[hidden] { display: none; }

    .steps { list-style: none; margin: 0 0 1.25rem; padding: 0; border: 1px solid var(--color-border); border-radius: 12px; overflow: hidden; }
    .steps[hidden] { display: none; }
    .step-row { display: flex; align-items: center; gap: 0.75rem; padding: 0.7rem 1rem; border-bottom: 1px solid var(--color-border); font-size: 0.9rem; }
    .step-row:last-child { border-bottom: none; }
    .step-row.done { background: var(--color-success-bg); color: var(--color-success-text); }
    .step-row.current { background: var(--color-bg); font-weight: 600; }
    .step-row.failed { background: var(--color-error-bg); color: var(--color-error-text); }
    .step-row.pending { color: var(--color-text-faint); }
    .step-icon { width: 20px; height: 20px; flex: 0 0 auto; display: flex; align-items: center; justify-content: center; font-size: 0.95rem; }
    .step-icon .dot { border: 1.5px solid var(--color-border-strong); border-radius: 50%; width: 14px; height: 14px; }
    .step-icon .spinner { width: 15px; height: 15px; }

    .long-hint { text-align: center; font-size: 0.85rem; color: var(--color-text-muted); margin: -0.5rem 0 1.25rem; }
    .long-hint[hidden] { display: none; }

    .page-footer { margin-top: 1.5rem; text-align: center; font-size: 0.85rem; color: var(--color-text-faint); }
    .page-footer a { color: var(--color-link); }
  </style>
</head>
<body>
  <div class="page-center">
    <div class="page-inner">
      <div id="brand-text" class="wappos-brand-mark">WAPPOS</div>
      <div class="page-subtitle"><span class="page-subtitle-rule"></span>{{ t('progress_title') }}<span class="page-subtitle-rule"></span></div>

      <div class="intro">{{ t('progress_intro') }}</div>

      <div id="spinner-row" class="spinner-row">
        <div class="spinner"></div>
        <div>{{ t('loading_title') }}</div>
      </div>

      <div id="step-label" class="step-label" hidden></div>
      <ul id="steps-list" class="steps" aria-live="polite" hidden></ul>
      <div id="long-hint" class="long-hint" hidden></div>

      <div id="banner-success" class="banner success" hidden>
        <div>{{ t('progress_done_title') }} {{ t('progress_done_text') }}</div>
        <a class="btn-portal" href="/wappos-portal/">{{ t('btn_go_to_portal') }}</a>
      </div>
      <div id="banner-error" class="banner error" hidden>
        <div>{{ t('progress_failed_title') }}</div>
        <div>{{ t('progress_failed_text') }}</div>
      </div>

      <div class="page-footer"><span class="wappos-brand-mark">WAPPOS</span> — © 2026 <a href="https://byrtn.fr" target="_blank" rel="noopener">BYRTN</a></div>
    </div>
  </div>

  <script>
    var spinnerRow = document.getElementById('spinner-row');
    var stepLabel = document.getElementById('step-label');
    var stepsList = document.getElementById('steps-list');
    var longHint = document.getElementById('long-hint');
    var bannerSuccess = document.getElementById('banner-success');
    var bannerError = document.getElementById('banner-error');
    var polling = true;

    function showDone() {
      polling = false;
      spinnerRow.hidden = true;
      bannerSuccess.hidden = false;
    }

    function renderSteps(data) {
      if (!data.steps || !data.steps.length) return;
      spinnerRow.hidden = true;
      stepLabel.hidden = !data.step_label;
      stepLabel.textContent = data.step_label || '';
      longHint.hidden = !data.long_hint;
      longHint.textContent = data.long_hint || '';

      stepsList.hidden = false;
      stepsList.innerHTML = data.steps.map(function (step) {
        var icon = '<span class="dot"></span>';
        if (step.state === 'done') icon = '✓';
        else if (step.state === 'current') icon = '<div class="spinner"></div>';
        else if (step.state === 'failed') icon = '✕';
        return '<li class="step-row ' + step.state + '"><span class="step-icon">' + icon + '</span><span>' +
          step.title.replace(/</g, '&lt;') + '</span></li>';
      }).join('');
    }

    function poll() {
      if (!polling) return;
      fetch('/progress-log', { cache: 'no-store' })
        .then(function (r) {
          var contentType = r.headers.get('content-type') || '';
          if (!contentType.includes('application/json')) {
            showDone();
            return null;
          }
          return r.json();
        })
        .then(function (data) {
          if (!data) return;
          renderSteps(data);

          if (data.done) {
            showDone();
          } else if (data.failed) {
            polling = false;
            spinnerRow.hidden = true;
            bannerError.hidden = false;
          } else {
            setTimeout(poll, 1500);
          }
        })
        .catch(function () {
          setTimeout(poll, 3000);
        });
    }

    poll();
  </script>
</body>
</html>

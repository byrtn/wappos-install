
packaging_format = 2

id = "prometheus"
name = "Prometheus"
description.en = "Metrics collection for the 3 Wappos apps — internal only (LAN + basic auth), not routed through nginx/SSO"
description.fr = "Collecte de métriques des 3 apps Wappos — usage interne uniquement (LAN + auth basique), non routé via nginx/SSO"

version = "1.0.0~ynh1"

maintainers = ["byrtn"]

[upstream]
license = "Apache-2.0"

[integration]
yunohost = ">= 12.1.0"
helpers_version = "2.0"
architectures = ["amd64"]
multi_instance = false

ldap = "not_relevant"
sso = false

disk = "200M"
ram.build = "50M"
ram.runtime = "200M"

[resources]
    [resources.system_user]

    [resources.ports]
    main.default = 9090

# Ce preseed repond aux questions techniques sans interet (miroir, paquets,
# chargeur de demarrage) ET fixe le mot de passe root (evite de le taper sur
# la console noVNC, dont le clavier est bugue). Toutes les autres questions
# "classiques" restent posees normalement : langue, clavier, fuseau horaire,
# partitionnement, nom de machine. Root login SSH est active automatiquement,
# et le mot de passe fixe devra etre change des la premiere connexion.
#
# L'installeur Wappos (github.com/byrtn/wappos-install) est clone directement
# sur le disque pendant l'installation Debian, et se lance automatiquement a
# la toute premiere connexion SSH (une seule fois) : Debian + Wappos ne font
# plus qu'un seul enchainement, sans commande a taper entre les deux.

d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

d-i clock-setup/ntp boolean true

d-i passwd/root-login boolean true
d-i passwd/make-user boolean false
d-i passwd/root-password password wapposinstall
d-i passwd/root-password-again password wapposinstall

tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string curl rsync git
d-i pkgsel/upgrade select none
popularity-contest popularity-contest/participate boolean false

d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string default

d-i preseed/late_command string \
    in-target sed -i 's/^#PermitRootLogin.*/PermitRootLogin yes/' /etc/ssh/sshd_config; \
    in-target chage -d 0 root; \
    in-target git clone https://github.com/byrtn/wappos-install.git /root/wappos-install; \
    in-target bash -c 'echo "if [ ! -f /root/.wappos-done ]; then" > /root/.profile'; \
    in-target bash -c 'echo "  cd /root/wappos-install && ./install-wappos.sh && touch /root/.wappos-done" >> /root/.profile'; \
    in-target bash -c 'echo "fi" >> /root/.profile'; \
    in-target chmod +x /root/wappos-install/install-wappos.sh

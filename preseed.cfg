# Ce preseed repond aux questions techniques sans interet (miroir, paquets,
# chargeur de demarrage). Toutes les autres questions "classiques" restent
# posees normalement : langue, clavier, fuseau horaire, partitionnement, nom
# de machine. Root login SSH est active automatiquement.
#
# Aucune question n'est posee pour le mot de passe root : la valeur figee
# ci-dessous ("wapposinstall") n'existe que le temps de satisfaire le
# passage oblige de l'installateur Debian par ce champ - elle est remplacee
# des la toute premiere ligne du late_command (avant meme que le systeme ne
# demarre en reseau) par un mot de passe aleatoire genere localement,
# unique a chaque machine, mis en cache dans /root/.wappos-boot-password
# (lisible par root uniquement). Ce mot de passe temporaire est lui-meme
# ecrase par yunohost des la fin du formulaire de configuration initiale
# dans le navigateur (le mot de passe admin Wappos choisi la devient aussi
# le mot de passe root, comportement natif de "yunohost tools postinstall").
# La connexion SSH par mot de passe est en plus desactivee des ce premier
# demarrage (voir plus bas) : toute l'installation se pilote depuis la
# console et le navigateur, sans jamais avoir besoin de SSH. Les deux
# mesures combinees eliminent tout mot de passe root connu ou devinable a
# distance pendant la fenetre d'installation.
#
# L'installeur Wappos (github.com/byrtn/wappos-install) est clone directement
# sur le disque pendant l'installation Debian, et se lance automatiquement au
# tout premier vrai demarrage (service systemd one-shot attache a la console,
# pas besoin qu'un humain se connecte pour le declencher) : Debian + Wappos ne
# font plus qu'un seul enchainement, sans commande a taper entre les deux.

d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string
d-i apt-setup/cdrom/set-first boolean false

# Sans ceci, Debian saute silencieusement la question reseau des que le DHCP
# reussit (comportement natif par defaut, meme sans preseed) - impossible de
# choisir une IP fixe dans ce cas. Force la question a etre posee a chaque
# fois (Automatique/Manuelle), comme une installation Debian manuelle avec
# reseau debranche le ferait deja.
d-i netcfg/disable_autoconfig boolean true

d-i clock-setup/ntp boolean true

d-i passwd/root-login boolean true
d-i passwd/make-user boolean false
d-i passwd/root-password password wapposinstall
d-i passwd/root-password-again password wapposinstall

tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string curl rsync git
d-i pkgsel/upgrade select none
popularity-contest popularity-contest/participate boolean false

d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string default

d-i debian-installer/exit/poweroff boolean true

d-i preseed/late_command string \
    in-target bash -c 'genpass="$(tr -dc "A-Za-z0-9" </dev/urandom | head -c 20)"; echo "root:$genpass" | chpasswd; install -m 600 /dev/null /root/.wappos-boot-password; echo "$genpass" > /root/.wappos-boot-password'; \
    in-target sed -i 's/^#PermitRootLogin.*/PermitRootLogin yes/' /etc/ssh/sshd_config; \
    in-target sed -i 's/^#\?PasswordAuthentication yes/PasswordAuthentication no/' /etc/ssh/sshd_config; \
    in-target mkdir -p /etc/systemd/system.conf.d; \
    in-target bash -c 'printf "%s\n" "[Manager]" "ShowStatus=no" > /etc/systemd/system.conf.d/wappos-quiet-console.conf'; \
    in-target bash -c 'for i in 1 2 3 4 5; do git clone https://github.com/byrtn/wappos-install.git /root/wappos-install && break; echo "Echec du clonage de wappos-install (tentative $i/5), nouvel essai dans 5s..." >> /root/wappos-clone.log; rm -rf /root/wappos-install; sleep 5; done'; \
    in-target bash -c 'if [ ! -f /root/wappos-install/install-wappos.sh ]; then echo "Le clonage de wappos-install a definitivement echoue apres 5 tentatives." >> /root/wappos-clone.log; exit 0; fi; \
        chmod +x /root/wappos-install/install-wappos.sh; \
        printf "%s\n" "[Unit]" "Description=Installation automatique de Wappos" "Documentation=https://github.com/byrtn/wappos-install" "After=network-online.target" "Wants=network-online.target getty-pre.target" "Before=getty-pre.target" "ConditionPathExists=!/root/.wappos-done" "StartLimitIntervalSec=1800" "StartLimitBurst=5" "" "[Service]" "Type=oneshot" "WorkingDirectory=/root/wappos-install" "ExecStartPre=/bin/sleep 20" "ExecStart=/root/wappos-install/install-wappos.sh" "Restart=on-failure" "RestartSec=15" "ExecStartPost=/usr/bin/touch /root/.wappos-done" "ExecStartPost=/bin/systemctl disable wappos-install.service" "StandardInput=tty" "StandardOutput=tty" "StandardError=tty" "TTYPath=/dev/tty1" "TTYReset=yes" "TTYVHangup=yes" "" "[Install]" "WantedBy=multi-user.target" > /etc/systemd/system/wappos-install.service; \
        systemctl enable wappos-install.service'
